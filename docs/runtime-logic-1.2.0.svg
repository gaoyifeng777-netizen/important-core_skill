<text x="770" y="1523" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" fill="#243B53" text-anchor="middle">读取：四路完整采用成果＋对应原件＋当前有效 G2 规则</text>
<text x="770" y="1557" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#52677E" text-anchor="middle">逐项判定与自查；待核线索不直接认定为缺陷</text>
<polyline points="770,1575 770,1640" fill="none" stroke="#2763A1" stroke-width="4"/>
<polygon points="770.00,1640.00 778.00,1624.00 762.00,1624.00" fill="#2763A1"/>
