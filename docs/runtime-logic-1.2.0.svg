<text x="956" y="1053" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#52677E" text-anchor="middle">原始记录、发言</text>
<text x="956" y="1092" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#52677E" text-anchor="middle">表决记录</text>
<rect x="1159" y="955" width="340" height="165" rx="16" fill="#FFFFFF" stroke="#92BCAD" stroke-width="2"/>
<text x="1329" y="1002" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#287D68" text-anchor="middle">决议识别</text>
<text x="1329" y="1053" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#52677E" text-anchor="middle">正式纪要、决议</text>
<text x="1329" y="1092" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#52677E" text-anchor="middle">补正材料</text>
<text x="770" y="1166" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#287D68" text-anchor="middle">各路只接收本角色指令＋获准资料＋中性任务，不接收其他路成果或判定规则</text>
