<text x="770" y="1690" font-family="Microsoft YaHei, sans-serif" font-size="36" font-weight="700" fill="#287D68" text-anchor="middle">每批独立业务复核</text>
<text x="770" y="1734" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="middle">默认全范围；逐项接受、退回或标明限制，退回仅重做限定项</text>
<text x="770" y="1771" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#52677E" text-anchor="middle">抽样或缩减范围先取得实际人工确认</text>
<polyline points="40,1715 10,1715 10,1503 40,1503" fill="none" stroke="#A94B4B" stroke-width="3" stroke-dasharray="9 6"/>
