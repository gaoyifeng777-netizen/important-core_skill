<text x="770" y="1341" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#52677E" text-anchor="middle">核对身份、来源引用、覆盖与完整结构；返工仅限受影响项，保留有效成果</text>
