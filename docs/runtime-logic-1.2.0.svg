<text x="72" y="1617" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#A94B4B" text-anchor="start">限定项退回并重新复核</text>
<polyline points="770,1790 770,1860" fill="none" stroke="#2763A1" stroke-width="4"/>
<polygon points="770.00,1860.00 778.00,1844.00 762.00,1844.00" fill="#2763A1"/>
<rect x="40" y="1860" width="1460" height="145" rx="20" fill="#FFF5DA" stroke="#D9B966" stroke-width="2"/>
<text x="770" y="1915" font-family="Microsoft YaHei, sans-serif" font-size="37" font-weight="700" fill="#725321" text-anchor="middle">最终人工签认 → 成果</text>
<text x="770" y="1962" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#7B6843" text-anchor="middle">评价人员认定问题、缺陷定级与最终签认；交付已做、未做和受限范围</text>
<rect x="1590" y="190" width="615" height="710" rx="20" fill="#FFFFFF" stroke="#BFCFE0" stroke-width="2"/>
<text x="1625" y="244" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#17314D" text-anchor="start">每次专业任务独立隔离</text>
<text x="1625" y="298" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">新 Windows AppContainer SID</text>
<text x="1625" y="345" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">新进程＋全新模型上下文</text>
<text x="1625" y="392" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">自己的 input 只读、output 可写</text>
<text x="1625" y="439" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">其他角色／主控私有区不可读</text>
<text x="1625" y="506" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#2763A1" text-anchor="start">四工具均在沙箱内执行</text>
<text x="1625" y="551" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#52677E" text-anchor="start">read_file  ·  list_directory</text>
<text x="1625" y="592" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#52677E" text-anchor="start">write_file  ·  run_command</text>
<text x="1625" y="665" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">命令后代核验同一 SID</text>
<text x="1625" y="712" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">角色无网络</text>
<text x="1625" y="759" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">主控仅转发模型推理</text>
<text x="1625" y="806" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#243B53" text-anchor="start">登录凭据保留在主控</text>
<rect x="1590" y="940" width="615" height="335" rx="20" fill="#F1EDF7" stroke="#C4B6DB" stroke-width="2"/>
<text x="1625" y="994" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#7353A4" text-anchor="start">上游成果如何交给下游</text>
<text x="1625" y="1051" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#243B53" text-anchor="start">判定、复核所需的完整上游成果</text>
<text x="1625" y="1098" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#243B53" text-anchor="start">由主控按授权复制为自己的输入</text>
<text x="1625" y="1145" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#243B53" text-anchor="start">不得越界直读其他角色工作区</text>
<text x="1625" y="1192" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" fill="#243B53" text-anchor="start">原件引用／映射不增加阅读权限</text>
<rect x="1590" y="1315" width="615" height="380" rx="20" fill="#FFFFFF" stroke="#BFCFE0" stroke-width="2"/>
<text x="1625" y="1369" font-family="Microsoft YaHei, sans-serif" font-size="33" font-weight="700" fill="#17314D" text-anchor="start">运行控制与业务边界</text>
<text x="1625" y="1427" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#2763A1" text-anchor="start">LangGraph 持久化保存</text>
<text x="1625" y="1471" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">确认、版本、任务、采用、复核状态</text>
<text x="1625" y="1519" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">沙箱：负责文件与命令权限</text>
<text x="1625" y="1567" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">业务正确性：须经独立业务复核</text>
<text x="1625" y="1615" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">最终签认：仍由评价人员完成</text>
<rect x="1590" y="1735" width="615" height="270" rx="20" fill="#FFF1ED" stroke="#DDB6AD" stroke-width="2"/>
<text x="1625" y="1790" font-family="Microsoft YaHei, sans-serif" font-size="32" font-weight="700" fill="#A94B4B" text-anchor="start">失败与返工只影响具体项</text>
<text x="1625" y="1844" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">保留真实失败证据与待办</text>
<text x="1625" y="1886" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">受影响项使用新身份／新上下文</text>
<text x="1625" y="1928" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">不重做已接受的无关成果</text>
<text x="1625" y="1970" font-family="Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#243B53" text-anchor="start">不静默降级权限或切换模型</text>
<text x="45" y="2076" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#52677E" text-anchor="start">依据：1.2.0 的 SKILL.md 与 sandbox-execution.md。结构通过、复核接受均不代替最终人工确认。</text>
<text x="45" y="2120" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#52677E" text-anchor="start">G1 资料授权 ≠ 准备就绪或已读；四路完整交付后才交判定；每批判定交接通过后立即安排独立复核。</text>
</svg>